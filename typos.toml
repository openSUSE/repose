# Configuration for crate-ci/typos (https://github.com/crate-ci/typos).
# Allowlist ONLY: every entry is a deliberate, load-bearing spelling or a
# generated/captured artifact — never a masked real typo.

[files]
extend-exclude = [
  # Real refhost fixtures / captured tool output: byte-identical data
  # snapshots, not prose to spell-check (e.g. "sle-hae", "Unknow version").
  "tests/vectors/**",
  # Generated from the clap CLI (see the rust-assets-drift job); the authored
  # source that produces them is still spell-checked.
  "crates/repose-cli/completions/**",
  "crates/repose-cli/man/**",
  # Captured performance reports/manifests and comparator fixtures: content
  # hash digests, mangled symbol names, and timing data, not prose (e.g.
  # digest "...ba28267" false-positives as the word "ba"). workloads.json
  # embeds reviewed digests for the same reason.
  # tests/performance/README.md, opportunity-matrix.md, and thresholds.json
  # stay spell-checked — they're authored prose.
  "tests/performance/workloads.json",
  "tests/performance/baselines/**",
  "tests/performance/profiles/**",
  "tests/performance/comparator-fixtures/**",
]

[default.extend-words]
# `transform_version_partialy`: the misspelling is the established name of the
# refhost version transform. Renaming it is a source change of its own, not a
# by-product of some other edit.
partialy = "partialy"
# User-facing error text pinned by tests/vectors/repoq/solve_repa.json
# ("Unknow version: ..."); the wording is part of repose's output.
unknow = "unknow"
# Fragments of "Qualität"/"café" split by \uXXXX escapes in the display.rs
# NDJSON escaping tests (e.g. "Qualität", "café").
qualit = "qualit"
caf = "caf"
